name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        id: build
        continue-on-error: true
        shell: bash
        env:
          JAMENDO_CLIENT_ID: ${{ secrets.JAMENDO_CLIENT_ID }}
        run: gradle assembleDebug --no-daemon --console=plain 2>&1 | tee build.log

      - name: Publish build log when the build fails
        if: steps.build.outcome == 'failure'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: buildlog
          name: build log (latest failed build)
          prerelease: true
          files: build.log
          overwrite_files: true

      - name: Stop here if the build failed
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: Rename APK with version
        run: |
          VER=$(grep -m1 'versionName' app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
          mv app/build/outputs/apk/debug/app-debug.apk "jukebox-v${VER}.apk"
          echo "APK_NAME=jukebox-v${VER}.apk" >> "$GITHUB_ENV"
          echo "VER=${VER}" >> "$GITHUB_ENV"

      - name: Publish APK to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VER }}-build${{ github.run_number }}
          name: 點唱收音機 v${{ env.VER }}(build ${{ github.run_number }})
          files: ${{ env.APK_NAME }}
